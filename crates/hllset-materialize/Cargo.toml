[package]
name = "hllset-materialize"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ingest + materialization morphisms: TokenLUT, CatalogLUT, consensus, streaming Ingestor, FPGA delegation"

[features]
default = []
# Delegate HLLSet operations (ingest, algebra, D/R/N, popcount, TF) to the
# hllset-fpga-simulator golden model through the fpga-hostif protocol.
# Default builds stay self-contained; this feature is the only place the
# external simulator appears, exactly like the simulator's own crosscheck
# feature pattern.
fpga-sim = ["dep:fpga-hostif", "dep:fpga-hllset"]

[dependencies]
hllset-core = { workspace = true }

# Optional, feature-gated FPGA simulator backends (never in default builds).
fpga-hostif = { path = "../../../hllset-fpga-simulator/crates/fpga-hostif", optional = true }
fpga-hllset = { path = "../../../hllset-fpga-simulator/crates/fpga-hllset", optional = true }
